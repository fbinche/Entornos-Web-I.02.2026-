<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Maqueta Semántica</title>
<!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="css/class_css.css">
</head>

<body>

    
    <header id="titulo">
        <h1>Práctica CSS</h1>
        <p id="descripcion"> usando css ----- </p>
    </header>

    <section>
        <h2>Sección 1</h2>
        <p>Primer párrafo</p>
        <p>Segundo párrafo</p>
        <button id="button">Botón</button>
        <hr>
    </section>


    <section>
        <h2 >Elemento con clase</h2>
        <p id="unico">Texto único</p>
    </section>

    
    <section >
        <h2>Combinadores</h2>
        <p>Hijo directo</p>
        <div>
            <p>Nieto</p>
        </div>
    </section>

  
    <section>
        <h2>Pseudo clases</h2>
        <a  id="vinculo">Pasa el mouse</a><br><br>
        <button>Haz click</button>
    </section>

    
    <section>
        <h2>Pseudo elementos</h2>
        <p>Este texto será modificado</p>
    </section>

    
    <section>
        <h2>Atributos</h2>
        <input type="text" placeholder="Nombre">
        <input type="email" placeholder="Correo">
    </section>

   
    <section>
        <h2>Estados</h2>
        <p id="activo">Activo</p>
        <p id="inactivo">Inactivo</p>
    </section>

    
    <section id="card">
        <h2>Combinado</h2>
        <p id="texto">Texto combinado</p>
        <button id="btn">Botón</button>
    </section>

    <footer>
        <p>Fin</p>
    </footer>

    

</body>

</html>
